- name: Oracle Primavera Gateway Integration API
  description: >-
    Oracle Primavera Gateway provides integration APIs for connecting Primavera P6 with other Oracle and
    third-party applications. Enables bi-directional data exchange for projects, resources, cost accounts,
    and activity data between P6 EPPM and ERP, asset management, and financial systems.
  image: https://www.oracle.com/a/ocom/img/social-og-oracle-cloud.jpg
