aid: oracle-primavera
name: Oracle Primavera
description: >-
  Oracle Primavera is a portfolio of project portfolio management (PPM) applications for construction, engineering, and
  capital project industries. Primavera APIs provide programmatic access to enterprise project portfolio management data
  including WBS structures, activity schedules, resource assignments, critical path analysis, and portfolio dashboards
  across cloud and on-premises deployments.
