- name: Oracle Primavera Analytics API
  description: >-
    Oracle Primavera Analytics provides reporting and business intelligence APIs for portfolio performance
    insights, project health dashboards, resource utilization analysis, and earned value management reporting
    across construction and engineering portfolios.
